name: Node CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
        with:
          # `pnpm check` replays known defects from history to confirm the fuzz
          # suites still catch them, so it needs more than the default shallow
          # clone. See scripts/check-fuzz-catches.mjs.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check quality, types, build, and tests
        run: |
          pnpm check
        env:
          CI: true

  react-versions:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    # Match @playwright/test in pnpm-lock.yaml so its browsers are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001 --ipc=host
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The peer range says which React versions are supported. This is what
      # makes that a fact rather than a hope: the suite runs against each of
      # them, on the version actually installed.
      - name: Install React ${{ matrix.react }}
        run: pnpm --filter @coaction/react add -D react@^${{ matrix.react }} react-dom@^${{ matrix.react }} @types/react@^${{ matrix.react }} @types/react-dom@^${{ matrix.react }}
      - run: pnpm --filter @coaction/react test
      - run: pnpm typecheck
      - name: Hydrate React ${{ matrix.react }} in real browsers
        run: pnpm test:e2e:browser hydration.spec.ts
        env:
          COACTION_REACT_MAJOR: ${{ matrix.react }}
